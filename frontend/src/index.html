<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <title>AutoRent</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- SVG em vez do .ico do Angular: um só ficheiro, nítido em qualquer tamanho e editável à mão -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Preconnect abre a ligação aos servidores do Google mais cedo,
    para as fontes chegarem mais depressa -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Só os pesos que usamos: menos ficheiros para descarregar. Sem internet, entra o fallback dos tokens (system-ui) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
